<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-1: #0f2027;
            --bg-2: #203a43;
            --bg-3: #2c5364;
            --card: rgba(15, 31, 61, 0.92);
            --card-hover: #1f4068;
            --accent: #ffd369;
            --text: #ffffff;
            --muted: #c8d2dc;
        }
        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
        }
        .page {
            width: min(1150px, calc(100% - 32px));
            margin: 0 auto;
            padding: 48px 0;
        }
        .header { text-align: center; margin-bottom: 36px; }
        .header h1 {
            font-size: clamp(34px, 6vw, 54px);
            color: var(--accent);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .header p { color: var(--muted); font-size: 17px; }
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 22px;
        }
        .subject-card {
            min-height: 190px;
            padding: 26px;
            border-radius: 18px;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            outline: none;
        }
        .subject-card:hover,
        .subject-card:focus-visible {
            background: var(--card-hover);
            transform: translateY(-6px);
            box-shadow: 0 18px 38px rgba(0, 0, 0, 0.42);
        }
        .subject-icon {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: rgba(255, 211, 105, 0.14);
            font-size: 31px;
            margin-bottom: 20px;
        }
        .subject-card h2 { font-size: 22px; margin-bottom: 8px; }
        .subject-card p { color: var(--muted); line-height: 1.5; font-size: 15px; }
        .open-label {
            margin-top: 22px;
            color: var(--accent);
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .empty-state {
            display: none;
            text-align: center;
            padding: 60px 25px;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.35);
            color: var(--muted);
        }
        footer {
            text-align: center;
            margin-top: 38px;
            color: rgba(255, 255, 255, 0.65);
            font-size: 14px;
        }
        @media (max-width: 600px) {
            .page { width: min(100% - 22px, 1150px); padding: 30px 0; }
            .subject-grid { grid-template-columns: 1fr; }
            .subject-card { min-height: 170px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="header">
            <h1>Ôn tập</h1>
            <p>Chọn môn học để bắt đầu ôn luyện</p>
        </header>

        <section id="subjectGrid" class="subject-grid"></section>

        <section id="emptyState" class="empty-state">
            <h2>Chưa có môn học</h2>
            <p>Hãy thêm môn học trong mảng <b>subjects</b> ở cuối file HTML.</p>
        </section>

        <footer>Trang tổng hợp tài liệu và câu hỏi ôn tập</footer>
    </main>

    <script>
        /*
        CÁCH THÊM MÔN HỌC:
        {
            name: "Tên môn",
            description: "Mô tả ngắn",
            icon: "📘",
            link: "ten-file.html"
        }

        Hãy đặt file HTML môn học cùng thư mục với file này.
        */
        const subjects = [
            {
                name: "Kỹ năng mềm",
                description: "Câu hỏi ôn tập kỹ năng mềm",
                icon: "🤝",
                link: "knm/"
            },
            {
                name: "Văn hóa kinh doanh",
                description: "Câu hỏi ôn tập Văn hóa kinh doanh và Tinh thần khởi nghiệp",
                icon: "🏢",
                link: "vhkd/"
            }
            // {
            //     name: "Môn học mới",
            //     description: "Bạn có thể thêm bao nhiêu môn học tùy ý",
            //     icon: "📝",
            //     link: "#"
            // }
        ];

        const subjectGrid = document.getElementById("subjectGrid");
        const emptyState = document.getElementById("emptyState");

        function openSubject(link) {
            if (!link || link === "#") {
                alert("Môn học này chưa được gắn file HTML.");
                return;
            }
            window.location.href = link;
        }

        function renderSubjects() {
            subjectGrid.innerHTML = "";
            if (subjects.length === 0) {
                subjectGrid.style.display = "none";
                emptyState.style.display = "block";
                return;
            }
            emptyState.style.display = "none";
            subjectGrid.style.display = "grid";

            subjects.forEach((subject) => {
                const card = document.createElement("article");
                card.className = "subject-card";
                card.tabIndex = 0;
                card.setAttribute("role", "button");
                card.setAttribute("aria-label", `Mở môn ${subject.name}`);
                card.innerHTML = `
                    <div>
                        <div class="subject-icon">${subject.icon || "📚"}</div>
                        <h2>${subject.name}</h2>
                        <p>${subject.description || "Nhấn để mở nội dung ôn tập"}</p>
                    </div>
                    <div class="open-label">
                        <span>Mở môn học</span>
                        <span>→</span>
                    </div>
                `;
                card.addEventListener("click", () => openSubject(subject.link));
                card.addEventListener("keydown", (event) => {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        openSubject(subject.link);
                    }
                });
                subjectGrid.appendChild(card);
            });
        }

        renderSubjects();
    </script>
</body>
</html>
